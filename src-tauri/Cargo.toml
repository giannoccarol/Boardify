[package]
name = "boardify"
version = "0.1.0"
description = "Boardify — clipboard manager visuale, locale e privacy-first per Linux e Windows"
authors = ["Boardify"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
arboard = "3"
sha2 = "0.10"
regex = "1"
base64 = "0.22"
dirs = "5"
image = { version = "0.25", features = ["png", "jpeg"] }
active-win-pos-rs = "0.7"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Backend Wayland per arboard + D-Bus per KWin: solo Linux.
arboard = { version = "3", features = ["wayland-data-control"] }
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
# API native: dialoghi, icone .exe, snapshot processi, cattura schermo (GDI).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
